name: CAN TV Playlist Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "sources.txt"
      - "categories.json"
      - "config.json"
      - "build.py"
      - "update_named_channels.py"
      - "data/kanal_kaynaklari.m3u"

permissions:
  contents: write

concurrency:
  group: playlist-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereksinimler
        run: python -m pip install --upgrade pip

      - name: Kanal kaynaklarını güncelle
        run: python update_named_channels.py

      - name: Playlist oluştur
        run: python build.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u
          git add data/kanal_kaynaklari.m3u
          git add data/kanal_raporu.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi

          git commit -m "chore: update playlist"

          git pull --rebase origin main

          git push origin main
